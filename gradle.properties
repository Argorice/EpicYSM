# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=epicysm
mod_name=EpicYSM
mod_version=1.1.1
mod_group_id=com.argorice.epicysm
mod_authors=Argorice
mod_description=Yes Steve Model characters fight with Epic Fight animations. Readable models are converted into Epic Fight meshes; encrypted ones are posed through their own skeleton.
mod_license=MIT

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.0
forge_version_range=[47,)
loader_version_range=[47,)

# Mappings
mapping_channel=parchment
mapping_version=2023.09.03-1.20.1

# Dependencies
# Epic Fight version used for compilation. The jar is resolved from the
# Modrinth maven; put a jar into local/libs/ as an offline fallback.
epicfight_version=20.14.17-mc1.20.1-forge
epicfight_version_range=[20.14.0,)
ysm_version_range=[2.6.0,)
